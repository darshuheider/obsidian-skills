name: Gemini release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the manifest version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version plugins/obsidian/gemini-extension.json)"
          if [[ "$version" != "${TAG#v}" ]]; then
            echo "gemini-extension.json is $version but the release tag is $TAG" >&2
            exit 1
          fi

      - run: ./scripts/package-gemini.sh dist/obsidian-gemini.tar.gz

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/obsidian-gemini.tar.gz --clobber
